name: Build Wild KSU custom release binaries

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REF: db2fc89899658a4345df3b27a34098a80cc00e2a

jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          path: config
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: WildKernels/Wild_KSU
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Compile matching ARM64 module
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE/source"
          cd source/kernel
          ID="$GITHUB_WORKSPACE/config/wild-build/identity.json"
          CONFIG_KSU=m CC=clang make \
            KSU_MANAGER_SIZE="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["certificate_size"])' "$ID")" \
            KSU_MANAGER_HASH="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["certificate_sha256"])' "$ID")" \
            KSU_MANAGER_PACKAGE=com.twj.wksu
          llvm-strip -d kernelsu.ko
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp kernelsu.ko "$GITHUB_WORKSPACE/out/android15-6.6_kernelsu.ko"
          python3 "$GITHUB_WORKSPACE/config/wild-build/verify-module.py" "$ID" "$GITHUB_WORKSPACE/out/android15-6.6_kernelsu.ko"
      - uses: actions/upload-artifact@v4
        with:
          name: wild-custom-module
          path: out/
          if-no-files-found: error

  userspace:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: module
    steps:
      - uses: actions/checkout@v4
        with:
          path: config
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: WildKernels/Wild_KSU
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wild-custom-module
          path: module
      - name: Install Rust targets and apply loader changes
        run: |
          rustup update stable
          rustup target add aarch64-unknown-linux-musl aarch64-linux-android
          rustup component add rustfmt clippy
          cp config/wild-build/loader/*.rs source/userspace/ksuinit/src/
          git -C source apply "$GITHUB_WORKSPACE/config/wild-build/daemon-lint.patch"
          cargo fmt --manifest-path source/userspace/ksuinit/Cargo.toml
          cargo fmt --manifest-path source/userspace/ksuinit/Cargo.toml -- --check
          cargo fmt --manifest-path source/userspace/ksud/Cargo.toml
          cargo fmt --manifest-path source/userspace/ksud/Cargo.toml -- --check
      - name: Test and lint loader
        run: |
          cargo test --locked --manifest-path source/userspace/ksuinit/Cargo.toml --lib
          cargo clippy --locked --manifest-path source/userspace/ksuinit/Cargo.toml --lib -- -D warnings
      - name: Build static ARM64 init
        run: |
          LLVM_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="$LLVM_BIN/aarch64-linux-android26-clang"
          RUSTFLAGS='-C link-arg=-no-pie' cargo build --locked --manifest-path source/userspace/ksuinit/Cargo.toml --target aarch64-unknown-linux-musl --release
      - name: Embed custom module and loader
        run: |
          cp module/android15-6.6_kernelsu.ko source/userspace/ksud/bin/aarch64/
          cp source/userspace/ksuinit/target/aarch64-unknown-linux-musl/release/ksuinit source/userspace/ksud/bin/aarch64/
          mkdir -p out
          cp module/*.ko out/
          cp source/userspace/ksud/bin/aarch64/ksuinit out/
          cp config/wild-build/identity.json out/
      - name: Build and lint ARM64 daemon
        run: |
          LLVM_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$LLVM_BIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$LLVM_BIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$LLVM_BIN/llvm-ar"
          cargo build --locked --manifest-path source/userspace/ksud/Cargo.toml --target aarch64-linux-android --release
          cargo clippy --locked --manifest-path source/userspace/ksud/Cargo.toml --target aarch64-linux-android --release
          cp source/userspace/ksud/target/aarch64-linux-android/release/ksud out/libksud.so
      - name: Build host patch tool and prepare exact firmware image
        run: |
          cargo build --locked --manifest-path source/userspace/ksud/Cargo.toml --release
          gzip -dc config/wild-build/input/stock-boot.img.gz > stock-boot.img
          sha256sum -c config/wild-build/input/stock-boot.sha256
          cp config/wild-build/magiskboot-x86_64 magiskboot
          chmod +x magiskboot
          source/userspace/ksud/target/release/ksud boot-patch \
            --boot "$PWD/stock-boot.img" --kmi android15-6.6 \
            --magiskboot "$PWD/magiskboot" --out "$PWD/out" \
            --out-name Wild_KSU-custom-gold-OS3.0.4.0-boot.img
      - name: Verify patched image contains the built module and loader
        run: |
          mkdir verify-boot verify-stock
          (cd verify-boot && ../magiskboot unpack ../out/Wild_KSU-custom-gold-OS3.0.4.0-boot.img && ../magiskboot cpio ramdisk.cpio extract)
          (cd verify-stock && ../magiskboot unpack ../stock-boot.img)
          cmp verify-boot/kernel verify-stock/kernel
          cmp verify-boot/init out/ksuinit
          cmp verify-boot/kernelsu.ko out/android15-6.6_kernelsu.ko
          (cd out && sha256sum *.img *.ko ksuinit libksud.so > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: wild-custom-release-binaries
          path: out/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wild-formatted-loader
          path: source/userspace/ksuinit/src/*.rs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wild-formatted-daemon
          path: source/userspace/ksud/src/
