name: Build SHIVKSU-NEXT driver

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged
    env:
      MANAGER_SIZE: '0x4d8'
      MANAGER_HASH: '996ec4da5ac204e00136f0dabf5605d613a9c5ac045514ee2eae266c89b3994a'
      MANAGER_PACKAGE: com.rifsxd.ksunext
    steps:
      - name: Read custom build patch
        uses: actions/checkout@v4
        with:
          path: build-config
          persist-credentials: false

      - name: Read KernelSU-Next 3.4.2 source
        uses: actions/checkout@v4
        with:
          repository: KernelSU-Next/KernelSU-Next
          ref: 4c706b5938665866ebe16944a481a7b91e3396af
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Support the existing manager certificate
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          git apply --check ../build-config/custom-root/certificate-support.patch
          git apply ../build-config/custom-root/certificate-support.patch
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          size = int(os.environ['MANAGER_SIZE'], 0)
          assert 0 < size <= 2048
          assert re.fullmatch(r'[0-9a-f]{64}', os.environ['MANAGER_HASH'])
          source = Path('kernel/manager/apk_sign.c').read_text()
          assert '#define CERT_MAX_LENGTH 2048' in source
          assert 'certificate_size != expected_size' in source
          assert 'return strcmp(expected_sha256, hash_str) == 0;' in source
          assert 'char cert[CERT_MAX_LENGTH]' not in source
          PY

      - name: Compile ARM64 android15-6.6 driver
        working-directory: source/kernel
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_KSU=m CC=clang make \
            KSU_NEXT_MANAGER_SIZE="$MANAGER_SIZE" \
            KSU_NEXT_MANAGER_HASH="$MANAGER_HASH" \
            KSU_MANAGER_PACKAGE="$MANAGER_PACKAGE"
          mkdir -p "$GITHUB_WORKSPACE/out"
          llvm-strip -d kernelsu.ko
          cp kernelsu.ko "$GITHUB_WORKSPACE/out/android15-6.6_SHIVKSU-NEXT_kernelsu.ko"

      - name: Verify build identity and checksum
        working-directory: out
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          data = Path('android15-6.6_SHIVKSU-NEXT_kernelsu.ko').read_bytes()
          assert data[:4] == b'\x7fELF'
          assert int.from_bytes(data[16:18], 'little') == 1
          assert int.from_bytes(data[18:20], 'little') == 183
          assert os.environ['MANAGER_HASH'].encode() in data
          assert os.environ['MANAGER_PACKAGE'].encode() in data
          assert b'79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7' not in data
          print('vermagic:', re.findall(rb'vermagic=([^\x00]+)', data))
          PY
          sha256sum android15-6.6_SHIVKSU-NEXT_kernelsu.ko > SHA256SUMS
          printf '%s\n' \
            'Built for the existing locally signed SHIVKSU-NEXT 3.4.2 APK.' \
            'Architecture: ARM64; KMI: android15-6.6.' \
            "Manager certificate size: $MANAGER_SIZE" \
            "Manager certificate SHA-256: $MANAGER_HASH" \
            'This artifact has not been tested on a device and is not a flashable boot image.' \
            'Do not flash a .ko file directly to a partition.' > BUILD-INFO.txt

      - name: Save custom driver
        uses: actions/upload-artifact@v4
        with:
          name: SHIVKSU-NEXT-android15-6.6-driver
          path: out/
          if-no-files-found: error
