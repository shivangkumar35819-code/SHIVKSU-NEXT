name: Build SHIVKSU NEXT APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;29.0.14206865'
      - name: Require matching release signing key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          test -n "$KEYSTORE" || { echo 'Configure KEYSTORE (base64), KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets. Debug-signed APKs cannot authenticate with the bundled drivers.'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/manager.jks"
      - name: Build release
        working-directory: manager
        env:
          ORG_GRADLE_PROJECT_KEYSTORE_FILE: ${{ runner.temp }}/manager.jks
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash gradlew assembleRelease --console=plain
      - name: Verify signing identity and all 16 drivers
        run: python3 tools/verify-root-apk.py manager/app/build/outputs/apk/release/SHIVKSU_NEXT_v3.4.2-shiv.1_33356-release.apk manager/app/src/main/assets/custom-lkm
      - uses: actions/upload-artifact@v4
        with:
          name: SHIVKSU-NEXT-APK
          path: manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
